name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install locked dependencies
        run: npm ci
      - name: Run content and navigation tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Build portfolio
        run: npm run build
        env:
          # Optional PUBLIC published-sheet URLs. Empty variables use local CSVs.
          VITE_MENU_CSV_URL: ${{ vars.VITE_MENU_CSV_URL }}
          VITE_ABOUT_CSV_URL: ${{ vars.VITE_ABOUT_CSV_URL }}
          VITE_RESUME_CSV_URL: ${{ vars.VITE_RESUME_CSV_URL }}
          VITE_SOCIALS_CSV_URL: ${{ vars.VITE_SOCIALS_CSV_URL }}
          VITE_JOURNEY_CSV_URL: ${{ vars.VITE_JOURNEY_CSV_URL }}
          VITE_QUESTIONS_CSV_URL: ${{ vars.VITE_QUESTIONS_CSV_URL }}
      - name: Upload built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    # Manual runs from other branches must not publish the site.
    if: github.ref == 'refs/heads/stable'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
